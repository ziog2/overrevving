name: Aggiorna classifiche Motorsport

on:
  schedule:
    - cron: '0 18 * * 6'
    - cron: '0 18 * * 0'
  workflow_dispatch: {}

jobs:
  update-standings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installa dipendenze (pdfjs-dist)
        run: |
          npm install --quiet pdfjs-dist@3.11.174

      - name: Scarica ed estrai classifiche da PDF Dorna e API
        env:
          JSONBIN_API_KEY: ${{ secrets.JSONBIN_API_KEY }}
          JSONBIN_BIN_ID: ${{ secrets.JSONBIN_BIN_ID }}
        run: |
          node .github/scripts/update_standings.js
