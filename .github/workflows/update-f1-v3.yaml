name: Aggiorna classifiche Motorsport ed Eventi

on:
  schedule:
    # Esecuzione ogni 30 minuti nei giorni di gara (Venerdì, Sabato, Domenica)
    # Impostato ai minuti 15 e 45 per evitare la congestione tipica dei runner GitHub ai minuti 00 e 30
    - cron: '15,45 * * * 5,6,0'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-standings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa dipendenze
        run: |
          npm install --quiet pdfjs-dist@3.11.174
          pip install --quiet pypdf openpyxl

      - name: Scarica ed estrai classifiche da PDF Dorna e API
        run: |
          node .github/scripts/update_standings.js

      - name: Aggiorna dati evento (event.html, event_moto2.html, event_moto3.html)
        run: |
          python3 .github/scripts/update_event_data.py

      - name: Estrai stint e gomme FP1 MotoGP da PDF Dorna
        run: |
          python3 .github/scripts/extract_motogp_fp1.py

      - name: Esporta database multi-anno, CSV e Excel per BI
        run: |
          python3 .github/scripts/export_database.py

      - name: Commit e push automatico se ci sono aggiornamenti
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add event.html event_moto2.html event_moto3.html category.html motogp.html data/ exports/ js/
          if git diff --staged --quiet; then
            echo "Nessuna modifica da inviare."
          else
            git commit -m "Auto-update motorsport database, standings, CSV and Excel [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
