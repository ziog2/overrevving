<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Details · Overrevving</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #18181c;
      --card-bg: #2c2c32;
      --card-border: #3a3a42;
      --accent-red: #c0392b;
      --accent-yellow: #f1c40f;
      --accent-blue: #2980b9;
      --accent-green: #2ecc71;
      --text-main: #e0e0e0;
      --text-sub: #888888;
      --font-heading: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: rgba(20, 20, 24, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--card-border);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 12px 24px;
    }

    .nav-container {
      max-width: 100%;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-logo-link {
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
    }

    .header-logo-img {
      height: 64px;
      width: auto;
      max-width: 360px;
      opacity: 0.95;
      transition: opacity 0.2s ease, transform 0.2s ease;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.4));
    }

    .header-logo-img:hover {
      opacity: 1;
      transform: scale(1.03);
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      border-radius: 8px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .back-btn:hover {
      background: #282832;
      border-color: #4a4a58;
      color: #fff;
    }

    main {
      max-width: 100%;
      margin: 0 auto;
      padding: 32px 24px;
      width: 100%;
      flex: 1;
    }

    /* Hero Event Card */
    .hero-card {
      background: linear-gradient(135deg, #1c1c24 0%, #252532 100%);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 32px;
      margin-bottom: 24px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
      position: relative;
      overflow: hidden;
    }

    .hero-card::before {
      content: '';
      position: absolute;
      top: 0; right: 0;
      width: 300px; height: 300px;
      background: radial-gradient(circle, rgba(231, 76, 60, 0.15) 0%, rgba(0,0,0,0) 70%);
      pointer-events: none;
    }

    .hero-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 16px;
    }

    .round-badge {
      display: inline-block;
      padding: 4px 12px;
      background: rgba(231, 76, 60, 0.2);
      border: 1px solid var(--accent-red);
      color: var(--accent-red);
      border-radius: 20px;
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .event-title {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.2;
      margin-bottom: 8px;
    }

    .circuit-sub {
      color: var(--text-sub);
      font-size: 15px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .flag-img {
      width: 22px;
      height: 15px;
      object-fit: cover;
      border-radius: 3px;
      vertical-align: middle;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }

    /* Weather Strip */
    .weather-strip {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
    }

    .weather-chip {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
    }

    .weather-chip span { color: var(--text-sub); font-weight: 400; }

    /* PDF Downloads Bar */
    .pdf-bar {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 16px 24px;
      margin-bottom: 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
    }

    .pdf-title {
      font-weight: 700;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .pdf-links {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .pdf-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .pdf-btn:hover {
      background: var(--accent-red);
      border-color: var(--accent-red);
      color: #fff;
    }

    /* Three-Column Grid: Starting Grid wide, Sprint & Race matching index.html */
    /* Grid Wrapper & Five-Column Layout: Fixed 280px cards flowing from left to right, matching index.html */
    .grid-wrapper-event {
      width: 100%;
      overflow-x: auto;
      padding-bottom: 16px;
      margin-bottom: 32px;
      -webkit-overflow-scrolling: touch;
    }

    .grid-five-col {
      display: flex;
      gap: 16px;
      width: max-content;
      margin: 0;
    }

    .grid-five-col .col-card {
      flex: 0 0 280px;
      width: 280px;
      min-width: 280px;
      max-width: 280px;
      box-sizing: border-box;
    }

    .fp1-header { background: #8e44ad; color: #fff; }
    .fp2-header { background: #16a085; color: #fff; }
    .laps-cell {
      text-align: center !important;
      font-family: 'Inter', monospace;
      font-size: 11px;
      color: #aaa;
    }

    .grid-header { background: #2980b9; color: #fff; }
    .time-cell {
      text-align: right !important;
      font-family: 'Inter', monospace;
      font-size: 12px;
      font-weight: 600;
      color: #e0e0e0;
    }
    .gap-cell {
      text-align: right !important;
      font-family: 'Inter', monospace;
      font-size: 11px;
      color: #999;
    }
    .pos-dnf {
      color: #ff5555 !important;
      background: rgba(255, 85, 85, 0.15);
      border: 1px solid rgba(255, 85, 85, 0.3);
      padding: 1px 5px;
      border-radius: 4px;
      font-weight: 700;
      font-size: 10px;
      display: inline-block;
      line-height: 1.2;
    }

    .col-card {
      background: #2c2c32;
      border: 1px solid #3a3a42;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
    }

    .col-header {
      padding: 14px 16px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      border-bottom: 1px solid #3a3a42;
      display: flex;
      justify-content: space-between;
      align-items: center;
      min-height: 52px;
      box-sizing: border-box;
    }

    .sprint-header { background: #e67e22; color: #fff; }
    .race-header { background: #c0392b; color: #fff; }

    .next-round {
      font-size: 12px;
      font-weight: 400;
      text-transform: none;
      letter-spacing: normal;
      opacity: 0.9;
    }

    /* Standings Tables */
    .standings-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    .standings-table thead th {
      padding: 7px 8px;
      text-align: left;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: #888;
      border-bottom: 1px solid #3a3a42;
      background: #252528;
      height: 34px;
      box-sizing: border-box;
    }

    .standings-table thead th.star-col { width: 28px; text-align: center; }
    .standings-table thead th:nth-child(2) { text-align: center; width: 34px; }
    .standings-table thead th:last-child { text-align: right; }

    .standings-table tbody tr {
      border-bottom: 1px solid #3a3a42;
      height: 38px;
    }

    .standings-table tbody tr:nth-child(even) {
      background: #28282e;
    }

    .standings-table tbody tr:last-child {
      border-bottom: none;
    }

    .standings-table tbody tr:hover {
      background: #333340;
    }

    .standings-table tbody tr.favorite {
      background: #2a1f3a !important;
    }

    .standings-table tbody tr.favorite:hover {
      background: #332545 !important;
    }

    .standings-table tbody tr.favorite td {
      background: transparent !important;
    }

    .standings-table tbody td {
      padding: 6px 8px;
      color: #ddd;
      vertical-align: middle;
      height: 38px;
      box-sizing: border-box;
    }

    .star-col { width: 28px; text-align: center !important; }

    .fav-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 13px;
      padding: 0 4px;
      opacity: 0.3;
      transition: opacity 0.15s, color 0.15s;
      line-height: 1;
      color: #999;
    }

    .fav-btn.active {
      opacity: 1;
      color: #ffd700;
    }

    .fav-btn:hover {
      opacity: 0.8;
    }

    .pos-cell {
      text-align: center !important;
      font-weight: 700;
      color: #aaa;
      font-size: 12px;
      width: 28px;
    }

    .pos-1 { color: #f1c40f; font-weight: 700; }
    .pos-2 { color: #bdc3c7; font-weight: 700; }
    .pos-3 { color: #e67e22; font-weight: 700; }
    .pos-nc { color: #777 !important; font-weight: bold; font-size: 11px; }

    .rider-name {
      font-weight: 400;
      color: #ddd;
      font-size: 13px;
    }

    .pts-scored {
      text-align: right !important;
      font-weight: 700;
      color: #f0c040;
      font-size: 14px;
    }

    .speed-cell {
      font-size: 11px;
      color: var(--text-sub);
      font-family: monospace;
    }

    /* Bottom Round Navigation */
    .round-nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 24px;
      border-top: 1px solid var(--card-border);
    }

    .nav-link {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 12px 20px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      color: var(--text-main);
      text-decoration: none;
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: 14px;
      transition: all 0.2s ease;
    }

    .nav-link:hover {
      background: #282832;
      border-color: var(--accent-red);
      color: #fff;
    }

    .nav-link.disabled {
      opacity: 0.4;
      pointer-events: none;
    }

    /* Inline Social Links */
    .footer-social-inline {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .footer-social-title {
      font-size: 11px;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 700;
    }
    .social-icons { display: flex; gap: 10px; justify-content: center; }
    .social-icon {
      width: 36px; height: 36px; border-radius: 8px;
      background: #252530; border: 1px solid var(--card-border);
      display: flex; align-items: center; justify-content: center;
      text-decoration: none; transition: background 0.2s, transform 0.15s;
      color: #ccc;
    }
    .social-icon:hover { background: #3a3a50; transform: translateY(-2px); }
    .social-icon svg { width: 16px; height: 16px; fill: currentColor; }

    @media (max-width: 768px) {
      .round-nav-bar {
        flex-direction: column;
        gap: 20px;
      }
      .nav-spacer { display: none; }
    }

    .loading-spinner {
      text-align: center;
      padding: 60px 0;
      color: var(--text-sub);
      font-size: 16px;
    }
  </style>
</head>

          const sprList = [];
          const longList = [];

    const FAV_KEY = 'overrevving_favorites';

    function getFavoritesSet() {
      try {
        const list = JSON.parse(localStorage.getItem(FAV_KEY) || '[]');
        return new Set(list);
      } catch(e) {
        return new Set();
      }
    }

    function isRiderFavorite(riderName) {
      if (!riderName) return false;
      const favs = getFavoritesSet();
      const nameTrim = riderName.trim();
      
      if (favs.has(`motogp:${nameTrim}`) || favs.has(nameTrim)) return true;
      
      for (let item of favs) {
        const cleanItem = item.includes(':') ? item.split(':')[1] : item;
        if (cleanItem.toLowerCase() === nameTrim.toLowerCase()) return true;
      }
      return false;
    }

    function toggleFav(btn, riderName) {
      if (!riderName) return;
      const nameTrim = riderName.trim();
      const favKey = `motogp:${nameTrim}`;
      const favs = getFavoritesSet();
      
      let isFavNow = false;
      if (isRiderFavorite(nameTrim)) {
        favs.delete(favKey);
        favs.delete(nameTrim);
        for (let item of Array.from(favs)) {
          const cleanItem = item.includes(':') ? item.split(':')[1] : item;
          if (cleanItem.toLowerCase() === nameTrim.toLowerCase()) favs.delete(item);
        }
      } else {
        favs.add(favKey);
        isFavNow = true;
      }
      
      localStorage.setItem(FAV_KEY, JSON.stringify([...favs]));
      
      document.querySelectorAll('.standings-table tbody tr').forEach(tr => {
        if (tr.dataset.riderName && tr.dataset.riderName.toLowerCase() === nameTrim.toLowerCase()) {
          tr.classList.toggle('favorite', isFavNow);
          const b = tr.querySelector('.fav-btn');
          if (b) b.classList.toggle('active', isFavNow);
        }
      });
    }

    function formatName(fullName) {
      if (!fullName) return '';
      const parts = fullName.trim().split(' ');
      if (parts.length < 2) return fullName;
      const normalized = parts.map(w =>
        w === w.toUpperCase() && w.length > 1 ? w.charAt(0) + w.slice(1).toLowerCase() : w
      );
      return normalized[0][0].toUpperCase() + '. ' + normalized.slice(1).join(' ');
    }

    function calculateSprintPts(pos) {
      const ptsMap = { 1: 12, 2: 9, 3: 7, 4: 6, 5: 5, 6: 4, 7: 3, 8: 2, 9: 1 };
      return ptsMap[pos] || 0;
    }

    function calculateRacePts(pos) {
      const ptsMap = { 1: 25, 2: 20, 3: 16, 4: 13, 5: 11, 6: 10, 7: 9, 8: 8, 9: 7, 10: 6, 11: 5, 12: 4, 13: 3, 14: 2, 15: 1 };
      return ptsMap[pos] || 0;
    }

    function parseLapTimeToSeconds(timeStr) {
      if (!timeStr || timeStr === '-' || !timeStr.includes(':')) return null;
      const parts = timeStr.trim().split(':');
      if (parts.length < 2) return null;
      const min = parseFloat(parts[0]);
      const sec = parseFloat(parts[1]);
      return min * 60 + sec;
    }

    function calculateGap(p1TimeStr, riderTimeStr) {
      const p1Sec = parseLapTimeToSeconds(p1TimeStr);
      const rSec = parseLapTimeToSeconds(riderTimeStr);
      if (p1Sec === null || rSec === null) return '-';
      const diff = rSec - p1Sec;
      if (diff <= 0.0001) return '-';
      return '+' + diff.toFixed(3);
    }
