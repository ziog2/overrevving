<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Details · Overrevving</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #141418;
      --card-bg: #1c1c22;
      --card-border: #2e2e38;
      --accent-red: #e74c3c;
      --accent-yellow: #f1c40f;
      --accent-blue: #3498db;
      --accent-green: #2ecc71;
      --text-main: #f0f0f5;
      --text-sub: #9e9ea0;
      --font-heading: 'Outfit', sans-serif;
      --font-body: 'Inter', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: rgba(20, 20, 24, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--card-border);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 14px 24px;
    }

    .nav-container {
      max-width: 1300px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: #fff;
    }

    .brand-logo {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #e74c3c, #c0392b);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-heading);
      font-weight: 900;
      font-size: 16px;
      box-shadow: 0 4px 12px rgba(231, 76, 60, 0.4);
    }

    .brand-text {
      font-family: var(--font-heading);
      font-weight: 800;
      font-size: 20px;
      letter-spacing: -0.5px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      border-radius: 8px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .back-btn:hover {
      background: #282832;
      border-color: #4a4a58;
      color: #fff;
    }

    main {
      max-width: 1300px;
      margin: 0 auto;
      padding: 32px 24px;
      width: 100%;
      flex: 1;
    }

    /* Hero Event Card */
    .hero-card {
      background: linear-gradient(135deg, #1c1c24 0%, #252532 100%);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 32px;
      margin-bottom: 24px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
      position: relative;
      overflow: hidden;
    }

    .hero-card::before {
      content: '';
      position: absolute;
      top: 0; right: 0;
      width: 300px; height: 300px;
      background: radial-gradient(circle, rgba(231, 76, 60, 0.15) 0%, rgba(0,0,0,0) 70%);
      pointer-events: none;
    }

    .hero-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 16px;
    }

    .round-badge {
      display: inline-block;
      padding: 4px 12px;
      background: rgba(231, 76, 60, 0.2);
      border: 1px solid var(--accent-red);
      color: var(--accent-red);
      border-radius: 20px;
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .event-title {
      font-family: var(--font-heading);
      font-size: 36px;
      font-weight: 900;
      letter-spacing: -1px;
      line-height: 1.1;
      margin-bottom: 8px;
    }

    .circuit-sub {
      color: var(--text-sub);
      font-size: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* Weather Strip */
    .weather-strip {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
    }

    .weather-chip {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
    }

    .weather-chip span { color: var(--text-sub); font-weight: 400; }

    /* PDF Downloads Bar */
    .pdf-bar {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 16px 24px;
      margin-bottom: 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
    }

    .pdf-title {
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .pdf-links {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .pdf-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .pdf-btn:hover {
      background: var(--accent-red);
      border-color: var(--accent-red);
      color: #fff;
    }

    /* Side-by-Side Grid */
    .grid-two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      margin-bottom: 32px;
    }

    @media (max-width: 950px) {
      .grid-two-col { grid-template-columns: 1fr; }
    }

    .col-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
    }

    .col-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--card-border);
    }

    .sprint-header { border-bottom-color: var(--accent-yellow); }
    .race-header { border-bottom-color: var(--accent-red); }

    .col-title {
      font-family: var(--font-heading);
      font-size: 20px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .badge-pts {
      font-size: 12px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-sub);
    }

    /* Standings Tables */
    .standings-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    .standings-table th {
      text-align: left;
      padding: 8px 10px;
      color: var(--text-sub);
      font-weight: 600;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .standings-table td {
      padding: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      vertical-align: middle;
    }

    .standings-table tr:hover {
      background: rgba(255, 255, 255, 0.03);
    }

    .pos-cell {
      font-family: var(--font-heading);
      font-weight: 800;
      font-size: 14px;
      width: 32px;
    }

    .pos-1 { color: #f1c40f; }
    .pos-2 { color: #bdc3c7; }
    .pos-3 { color: #e67e22; }

    .rider-name {
      font-weight: 700;
      color: #fff;
    }

    .rider-num {
      font-size: 11px;
      color: var(--text-sub);
      font-family: var(--font-heading);
      margin-left: 4px;
    }

    .team-name {
      font-size: 12px;
      color: var(--text-sub);
    }

    .pts-scored {
      font-family: var(--font-heading);
      font-weight: 800;
      font-size: 15px;
      color: var(--accent-green);
      text-align: right;
    }

    .speed-cell {
      font-size: 11px;
      color: var(--text-sub);
      font-family: monospace;
    }

    /* Bottom Round Navigation */
    .round-nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 24px;
      border-top: 1px solid var(--card-border);
    }

    .nav-link {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 12px 20px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      color: var(--text-main);
      text-decoration: none;
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: 14px;
      transition: all 0.2s ease;
    }

    .nav-link:hover {
      background: #282832;
      border-color: var(--accent-red);
      color: #fff;
    }

    .nav-link.disabled {
      opacity: 0.4;
      pointer-events: none;
    }

    .loading-spinner {
      text-align: center;
      padding: 60px 0;
      color: var(--text-sub);
      font-size: 16px;
    }
  </style>
</head>
<body>

  <header>
    <div class="nav-container">
      <a href="motogp.html" class="brand">
        <div class="brand-logo">OR</div>
        <div class="brand-text">OVERREVVING</div>
      </a>
      <a href="motogp.html" class="back-btn">
        ← Back to Standings
      </a>
    </div>
  </header>

  <main id="main-content">
    <div class="loading-spinner">Loading Grand Prix details...</div>
  </main>

  <script>
    const SEASON_2026 = "e88b4e43-2209-47aa-8e83-0e0b1cedde6e";
    const CAT_MOTOGP = "e8c110ad-64aa-4e8e-8a86-f2f152f6a942";

    const GP_ROUNDS = [
      { round: 'R01', short: 'THA', name: 'PT Grand Prix of Thailand', circuit: 'Chang International Circuit', location: 'Buriram', date: '27 Feb - 01 Mar 2026', flag: '🇹🇭' },
      { round: 'R02', short: 'BRA', name: 'Grand Prix of Brazil', circuit: 'Autódromo Internacional de Goiânia', location: 'Goiânia', date: '20 Mar - 22 Mar 2026', flag: '🇧🇷' },
      { round: 'R03', short: 'USA', name: 'Grand Prix of The Americas', circuit: 'Circuit of the Americas', location: 'Austin', date: '27 Mar - 29 Mar 2026', flag: '🇺🇸' },
      { round: 'R04', short: 'SPA', name: 'Gran Premio de España', circuit: 'Circuito de Jerez', location: 'Jerez de la Frontera', date: '24 Apr - 26 Apr 2026', flag: '🇪🇸' },
      { round: 'R05', short: 'FRA', name: 'Grand Prix de France', circuit: 'Le Mans Bugatti Circuit', location: 'Le Mans', date: '08 May - 10 May 2026', flag: '🇫🇷' },
      { round: 'R06', short: 'CAT', name: 'Gran Premi de Catalunya', circuit: 'Circuit de Barcelona-Catalunya', location: 'Montmeló', date: '15 May - 17 May 2026', flag: '🏁' },
      { round: 'R07', short: 'ITA', name: 'Gran Premio d\'Italia', circuit: 'Autodromo Internazionale del Mugello', location: 'Scarperia e San Piero', date: '29 May - 31 May 2026', flag: '🇮🇹' },
      { round: 'R08', short: 'HUN', name: 'Hungarian Grand Prix', circuit: 'Balaton Park Circuit', location: 'Balatonfőkajár', date: '05 Jun - 07 Jun 2026', flag: '🇭🇺' },
      { round: 'R09', short: 'CZE', name: 'Grand Prix of Czechia', circuit: 'Automotodrom Brno', location: 'Brno', date: '19 Jun - 21 Jun 2026', flag: '🇨🇿' },
      { round: 'R10', short: 'NED', name: 'TT Assen', circuit: 'TT Circuit Assen', location: 'Assen', date: '26 Jun - 28 Jun 2026', flag: '🇳🇱' },
      { round: 'R11', short: 'GER', name: 'Motorrad Grand Prix Deutschland', circuit: 'Sachsenring', location: 'Hohenstein-Ernstthal', date: '10 Jul - 12 Jul 2026', flag: '🇩🇪' },
      { round: 'R12', short: 'GBR', name: 'British Grand Prix', circuit: 'Silverstone Circuit', location: 'Silverstone', date: '07 Aug - 09 Aug 2026', flag: '🇬🇧' },
      { round: 'R13', short: 'ARA', name: 'Gran Premio de Aragón', circuit: 'MotorLand Aragón', location: 'Alcañiz', date: '28 Aug - 30 Aug 2026', flag: '🇪🇸' },
      { round: 'R14', short: 'RSM', name: 'Gran Premio di San Marino', circuit: 'Misano World Circuit Marco Simoncelli', location: 'Misano Adriatico', date: '11 Sep - 13 Sep 2026', flag: '🇸🇲' },
      { round: 'R15', short: 'AUT', name: 'Austrian Grand Prix', circuit: 'Red Bull Ring', location: 'Spielberg', date: '18 Sep - 20 Sep 2026', flag: '🇦🇹' },
      { round: 'R16', short: 'JPN', name: 'Grand Prix of Japan', circuit: 'Mobility Resort Motegi', location: 'Motegi', date: '02 Oct - 04 Oct 2026', flag: '🇯🇵' },
      { round: 'R17', short: 'INA', name: 'Indonesian Grand Prix', circuit: 'Pertamina Mandalika Circuit', location: 'Lombok', date: '09 Oct - 11 Oct 2026', flag: '🇮🇩' },
      { round: 'R18', short: 'AUS', name: 'Australian Grand Prix', circuit: 'Phillip Island Grand Prix Circuit', location: 'Phillip Island', date: '23 Oct - 25 Oct 2026', flag: '🇦🇺' },
      { round: 'R19', short: 'MAL', name: 'Malaysian Grand Prix', circuit: 'PETRONAS Sepang International Circuit', location: 'Sepang', date: '30 Oct - 01 Nov 2026', flag: '🇲🇾' },
      { round: 'R20', short: 'QAT', name: 'Qatar Grand Prix', circuit: 'Lusail International Circuit', location: 'Lusail', date: '06 Nov - 08 Nov 2026', flag: '🇶🇦' },
      { round: 'R21', short: 'POR', name: 'Grande Prémio de Portugal', circuit: 'Autódromo Internacional do Algarve', location: 'Portimão', date: '20 Nov - 22 Nov 2026', flag: '🇵🇹' },
      { round: 'R22', short: 'VAL', name: 'Gran Premio de la Comunitat Valenciana', circuit: 'Circuit Ricardo Tormo', location: 'Cheste', date: '27 Nov - 29 Nov 2026', flag: '🇪🇸' }
    ];

    function getQueryParams() {
      const params = new URLSearchParams(window.location.search);
      return {
        year: params.get('year') || '2026',
        round: (params.get('round') || 'R01').toUpperCase()
      };
    }

    async function initEventPage() {
      const { year, round } = getQueryParams();
      const roundIdx = GP_ROUNDS.findIndex(r => r.round === round);
      const gp = GP_ROUNDS[roundIdx >= 0 ? roundIdx : 0];

      const prevGp = roundIdx > 0 ? GP_ROUNDS[roundIdx - 1] : null;
      const nextGp = roundIdx < GP_ROUNDS.length - 1 ? GP_ROUNDS[roundIdx + 1] : null;

      document.title = `${year} ${gp.round} · ${gp.name} · Overrevving`;

      try {
        // Query Pulselive API for Events
        const eventsUrl = `https://api.motogp.pulselive.com/motogp/v1/results/events?seasonUuid=${SEASON_2026}&categoryUuid=${CAT_MOTOGP}`;
        const events = await fetch(eventsUrl).then(r => r.json());
        const apiEvent = events.find(e => e.short_name === gp.short);

        let sprintResults = [];
        let raceResults = [];
        let weatherInfo = { track: 'Dry', weather: 'Partly-Cloudy', air: '32°C', ground: '50°C', humidity: '45%' };

        if (apiEvent) {
          const sessionsUrl = `https://api.motogp.pulselive.com/motogp/v1/results/sessions?eventUuid=${apiEvent.id}&categoryUuid=${CAT_MOTOGP}`;
          const sessions = await fetch(sessionsUrl).then(r => r.json());

          const sprSess = sessions.find(s => s.type === 'SPR' && s.status === 'FINISHED');
          const racSess = sessions.find(s => s.type === 'RAC' && s.status === 'FINISHED');

          if (racSess && racSess.condition) {
            weatherInfo = {
              track: racSess.condition.track || 'Dry',
              weather: racSess.condition.weather || 'Sunny',
              air: racSess.condition.air || '30°C',
              ground: racSess.condition.ground || '48°C',
              humidity: racSess.condition.humidity || '40%'
            };
          }

          if (sprSess) {
            const classUrl = `https://api.motogp.pulselive.com/motogp/v1/results/session/${sprSess.id}/classification`;
            const data = await fetch(classUrl).then(r => r.json());
            sprintResults = data.classification || [];
          }

          if (racSess) {
            const classUrl = `https://api.motogp.pulselive.com/motogp/v1/results/session/${racSess.id}/classification`;
            const data = await fetch(classUrl).then(r => r.json());
            raceResults = data.classification || [];
          }
        }

        renderPageLayout(year, gp, prevGp, nextGp, weatherInfo, sprintResults, raceResults);

      } catch (err) {
        console.error("Error fetching event details:", err);
        renderPageLayout(year, gp, prevGp, nextGp, { track: 'Dry', weather: 'Sunny', air: '32°C', ground: '50°C', humidity: '45%' }, [], []);
      }
    }

    function calculateSprintPts(pos) {
      const ptsMap = { 1: 12, 2: 9, 3: 7, 4: 6, 5: 5, 6: 4, 7: 3, 8: 2, 9: 1 };
      return ptsMap[pos] || 0;
    }

    function calculateRacePts(pos) {
      const ptsMap = { 1: 25, 2: 20, 3: 16, 4: 13, 5: 11, 6: 10, 7: 9, 8: 8, 9: 7, 10: 6, 11: 5, 12: 4, 13: 3, 14: 2, 15: 1 };
      return ptsMap[pos] || 0;
    }

    function renderPageLayout(year, gp, prevGp, nextGp, weather, sprintResults, raceResults) {
      const mainEl = document.getElementById('main-content');

      const pdfBase = `https://resources.motogp.com/files/results/${year}/${gp.short}/MotoGP/RAC`;

      let sprintRows = '';
      if (sprintResults.length) {
        sprintResults.forEach((r, idx) => {
          const pos = r.position || idx + 1;
          const pc = pos === 1 ? 'pos-1' : pos === 2 ? 'pos-2' : pos === 3 ? 'pos-3' : '';
          const pts = calculateSprintPts(pos);
          const bestLap = r.best_lap ? r.best_lap.time : '-';
          const topSpeed = r.top_speed ? `${r.top_speed} km/h` : '-';

          sprintRows += `<tr>
            <td class="pos-cell ${pc}">${pos}</td>
            <td>
              <div class="rider-name">${r.rider ? r.rider.full_name : 'Rider'}<span class="rider-num">#${r.rider ? r.rider.number : ''}</span></div>
              <div class="team-name">${r.team ? r.team.name : ''}</div>
            </td>
            <td>${bestLap}</td>
            <td class="speed-cell">${topSpeed}</td>
            <td class="pts-scored">${pts > 0 ? '+' + pts : '0'}</td>
          </tr>`;
        });
      } else {
        sprintRows = `<tr><td colspan="5" style="text-align:center; padding: 24px; color: var(--text-sub);">No Sprint Race data available for this round.</td></tr>`;
      }

      let raceRows = '';
      if (raceResults.length) {
        raceResults.forEach((r, idx) => {
          const pos = r.position || idx + 1;
          const pc = pos === 1 ? 'pos-1' : pos === 2 ? 'pos-2' : pos === 3 ? 'pos-3' : '';
          const pts = calculateRacePts(pos);
          const bestLap = r.best_lap ? r.best_lap.time : '-';
          const topSpeed = r.top_speed ? `${r.top_speed} km/h` : '-';

          raceRows += `<tr>
            <td class="pos-cell ${pc}">${pos}</td>
            <td>
              <div class="rider-name">${r.rider ? r.rider.full_name : 'Rider'}<span class="rider-num">#${r.rider ? r.rider.number : ''}</span></div>
              <div class="team-name">${r.team ? r.team.name : ''}</div>
            </td>
            <td>${bestLap}</td>
            <td class="speed-cell">${topSpeed}</td>
            <td class="pts-scored">${pts > 0 ? '+' + pts : '0'}</td>
          </tr>`;
        });
      } else {
        raceRows = `<tr><td colspan="5" style="text-align:center; padding: 24px; color: var(--text-sub);">No Main Race data available for this round.</td></tr>`;
      }

      mainEl.innerHTML = `
        <div class="hero-card">
          <div class="hero-top">
            <div>
              <div class="round-badge">${year} SEASON · ROUND ${gp.round.replace('R','')}</div>
              <h1 class="event-title">${gp.name}</h1>
              <div class="circuit-sub">
                <span>${gp.flag} ${gp.circuit} · ${gp.location}</span>
                <span>•</span>
                <span>${gp.date}</span>
              </div>
            </div>
          </div>

          <div class="weather-strip">
            <div class="weather-chip">🏁 <span>Track:</span> <strong>${weather.track}</strong></div>
            <div class="weather-chip">☀️ <span>Air Temp:</span> <strong>${weather.air}</strong></div>
            <div class="weather-chip">🛣️ <span>Track Temp:</span> <strong>${weather.ground}</strong></div>
            <div class="weather-chip">💧 <span>Humidity:</span> <strong>${weather.humidity}</strong></div>
            <div class="weather-chip">🌤️ <span>Weather:</span> <strong>${weather.weather}</strong></div>
          </div>
        </div>

        <div class="pdf-bar">
          <div class="pdf-title">📄 Official Dorna PDF Documents:</div>
          <div class="pdf-links">
            <a href="${pdfBase}/Classification.pdf" target="_blank" class="pdf-btn">📊 Classification.pdf</a>
            <a href="${pdfBase}/Analysis.pdf" target="_blank" class="pdf-btn">⏱️ Analysis.pdf</a>
            <a href="${pdfBase}/MaximumSpeed.pdf" target="_blank" class="pdf-btn">🚀 TopSpeed.pdf</a>
            <a href="${pdfBase}/Grid.pdf" target="_blank" class="pdf-btn">🏁 Grid.pdf</a>
            <a href="${pdfBase}/WorldStanding.pdf" target="_blank" class="pdf-btn">🏆 WorldStanding.pdf</a>
          </div>
        </div>

        <div class="grid-two-col">
          <!-- LEFT COLUMN: SPRINT RACE -->
          <div class="col-card">
            <div class="col-header sprint-header">
              <div class="col-title">⚡ Sprint Race Standings</div>
              <div class="badge-pts">Sprint Points (12-1)</div>
            </div>
            <table class="standings-table">
              <thead>
                <tr>
                  <th>#</th>
                  <th>Rider / Team</th>
                  <th>Best Lap</th>
                  <th>Top Speed</th>
                  <th style="text-align:right">Pts</th>
                </tr>
              </thead>
              <tbody>
                ${sprintRows}
              </tbody>
            </table>
          </div>

          <!-- RIGHT COLUMN: MAIN RACE -->
          <div class="col-card">
            <div class="col-header race-header">
              <div class="col-title">🏁 Main Race Standings</div>
              <div class="badge-pts">Race Points (25-1)</div>
            </div>
            <table class="standings-table">
              <thead>
                <tr>
                  <th>#</th>
                  <th>Rider / Team</th>
                  <th>Best Lap</th>
                  <th>Top Speed</th>
                  <th style="text-align:right">Pts</th>
                </tr>
              </thead>
              <tbody>
                ${raceRows}
              </tbody>
            </table>
          </div>
        </div>

        <div class="round-nav-bar">
          ${prevGp ? `<a href="event.html?year=${year}&round=${prevGp.round}" class="nav-link">← ${prevGp.round}: ${prevGp.name}</a>` : `<span class="nav-link disabled">← First Round</span>`}
          ${nextGp ? `<a href="event.html?year=${year}&round=${nextGp.round}" class="nav-link">${nextGp.round}: ${nextGp.name} →</a>` : `<span class="nav-link disabled">Final Round →</span>`}
        </div>
      `;
    }

    document.addEventListener('DOMContentLoaded', initEventPage);
  </script>
</body>
</html>
