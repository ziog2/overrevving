<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Details · Overrevving</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #18181c;
      --card-bg: #2c2c32;
      --card-border: #3a3a42;
      --accent-red: #c0392b;
      --accent-yellow: #f1c40f;
      --accent-blue: #2980b9;
      --accent-green: #2ecc71;
      --text-main: #e0e0e0;
      --text-sub: #888888;
      --font-heading: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: rgba(20, 20, 24, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--card-border);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 12px 24px;
    }

    .nav-container {
      max-width: 1300px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-logo-link {
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
    }

    .header-logo-img {
      height: 64px;
      width: auto;
      max-width: 360px;
      opacity: 0.95;
      transition: opacity 0.2s ease, transform 0.2s ease;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.4));
    }

    .header-logo-img:hover {
      opacity: 1;
      transform: scale(1.03);
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      border-radius: 8px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .back-btn:hover {
      background: #282832;
      border-color: #4a4a58;
      color: #fff;
    }

    main {
      max-width: 1300px;
      margin: 0 auto;
      padding: 32px 24px;
      width: 100%;
      flex: 1;
    }

    /* Hero Event Card */
    .hero-card {
      background: linear-gradient(135deg, #1c1c24 0%, #252532 100%);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 32px;
      margin-bottom: 24px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
      position: relative;
      overflow: hidden;
    }

    .hero-card::before {
      content: '';
      position: absolute;
      top: 0; right: 0;
      width: 300px; height: 300px;
      background: radial-gradient(circle, rgba(231, 76, 60, 0.15) 0%, rgba(0,0,0,0) 70%);
      pointer-events: none;
    }

    .hero-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 16px;
    }

    .round-badge {
      display: inline-block;
      padding: 4px 12px;
      background: rgba(231, 76, 60, 0.2);
      border: 1px solid var(--accent-red);
      color: var(--accent-red);
      border-radius: 20px;
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .event-title {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.2;
      margin-bottom: 8px;
    }

    .circuit-sub {
      color: var(--text-sub);
      font-size: 15px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .flag-img {
      width: 22px;
      height: 15px;
      object-fit: cover;
      border-radius: 3px;
      vertical-align: middle;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }

    /* Weather Strip */
    .weather-strip {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
    }

    .weather-chip {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
    }

    .weather-chip span { color: var(--text-sub); font-weight: 400; }

    /* PDF Downloads Bar */
    .pdf-bar {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 16px 24px;
      margin-bottom: 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
    }

    .pdf-title {
      font-weight: 700;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .pdf-links {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .pdf-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .pdf-btn:hover {
      background: var(--accent-red);
      border-color: var(--accent-red);
      color: #fff;
    }

    /* Three-Column Grid matching index.html card width */
    .grid-three-col {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      max-width: 900px;
      margin: 0 auto 32px;
    }

    @media (max-width: 900px) {
      .grid-three-col {
        grid-template-columns: repeat(auto-fit, minmax(275px, 1fr));
      }
    }

    .grid-header { background: #2980b9; color: #fff; }
    .time-cell {
      text-align: right !important;
      font-family: 'Inter', monospace;
      font-size: 12px;
      font-weight: 600;
      color: #e0e0e0;
    }
    .gap-cell {
      text-align: right !important;
      font-family: 'Inter', monospace;
      font-size: 11px;
      color: #999;
    }
    .pos-dnf {
      color: #ff5555 !important;
      background: rgba(255, 85, 85, 0.15);
      border: 1px solid rgba(255, 85, 85, 0.3);
      padding: 1px 5px;
      border-radius: 4px;
      font-weight: 700;
      font-size: 10px;
      display: inline-block;
      line-height: 1.2;
    }

    .col-card {
      background: #2c2c32;
      border: 1px solid #3a3a42;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
    }

    .col-header {
      padding: 14px 16px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      border-bottom: 1px solid #3a3a42;
      display: flex;
      justify-content: space-between;
      align-items: center;
      min-height: 52px;
      box-sizing: border-box;
    }

    .sprint-header { background: #e67e22; color: #fff; }
    .race-header { background: #c0392b; color: #fff; }

    .next-round {
      font-size: 12px;
      font-weight: 400;
      text-transform: none;
      letter-spacing: normal;
      opacity: 0.9;
    }

    /* Standings Tables */
    .standings-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    .standings-table thead th {
      padding: 7px 8px;
      text-align: left;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: #888;
      border-bottom: 1px solid #3a3a42;
      background: #252528;
      height: 34px;
      box-sizing: border-box;
    }

    .standings-table thead th.star-col { width: 28px; text-align: center; }
    .standings-table thead th:nth-child(2) { text-align: center; width: 34px; }
    .standings-table thead th:last-child { text-align: right; }

    .standings-table tbody tr {
      border-bottom: 1px solid #3a3a42;
      height: 38px;
    }

    .standings-table tbody tr:nth-child(even) {
      background: #28282e;
    }

    .standings-table tbody tr:last-child {
      border-bottom: none;
    }

    .standings-table tbody tr:hover {
      background: #333340;
    }

    .standings-table tbody tr.favorite {
      background: #2a1f3a !important;
    }

    .standings-table tbody tr.favorite:hover {
      background: #332545 !important;
    }

    .standings-table tbody tr.favorite td {
      background: transparent !important;
    }

    .standings-table tbody td {
      padding: 6px 8px;
      color: #ddd;
      vertical-align: middle;
      height: 38px;
      box-sizing: border-box;
    }

    .star-col { width: 28px; text-align: center !important; }

    .fav-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 13px;
      padding: 0 4px;
      opacity: 0.3;
      transition: opacity 0.15s, color 0.15s;
      line-height: 1;
      color: #999;
    }

    .fav-btn.active {
      opacity: 1;
      color: #ffd700;
    }

    .fav-btn:hover {
      opacity: 0.8;
    }

    .pos-cell {
      text-align: center !important;
      font-weight: 700;
      color: #aaa;
      font-size: 12px;
      width: 28px;
    }

    .pos-1 { color: #f1c40f; font-weight: 700; }
    .pos-2 { color: #bdc3c7; font-weight: 700; }
    .pos-3 { color: #e67e22; font-weight: 700; }
    .pos-nc { color: #777 !important; font-weight: bold; font-size: 11px; }

    .rider-name {
      font-weight: 400;
      color: #ddd;
      font-size: 13px;
    }

    .pts-scored {
      text-align: right !important;
      font-weight: 700;
      color: #f0c040;
      font-size: 14px;
    }

    .speed-cell {
      font-size: 11px;
      color: var(--text-sub);
      font-family: monospace;
    }

    /* Bottom Round Navigation */
    .round-nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 24px;
      border-top: 1px solid var(--card-border);
    }

    .nav-link {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 12px 20px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      color: var(--text-main);
      text-decoration: none;
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: 14px;
      transition: all 0.2s ease;
    }

    .nav-link:hover {
      background: #282832;
      border-color: var(--accent-red);
      color: #fff;
    }

    .nav-link.disabled {
      opacity: 0.4;
      pointer-events: none;
    }

    /* Inline Social Links */
    .footer-social-inline {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .footer-social-title {
      font-size: 11px;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 700;
    }
    .social-icons { display: flex; gap: 10px; justify-content: center; }
    .social-icon {
      width: 36px; height: 36px; border-radius: 8px;
      background: #252530; border: 1px solid var(--card-border);
      display: flex; align-items: center; justify-content: center;
      text-decoration: none; transition: background 0.2s, transform 0.15s;
      color: #ccc;
    }
    .social-icon:hover { background: #3a3a50; transform: translateY(-2px); }
    .social-icon svg { width: 16px; height: 16px; fill: currentColor; }

    @media (max-width: 768px) {
      .round-nav-bar {
        flex-direction: column;
        gap: 20px;
      }
      .nav-spacer { display: none; }
    }

    .loading-spinner {
      text-align: center;
      padding: 60px 0;
      color: var(--text-sub);
      font-size: 16px;
    }
  </style>
</head>

 function getQueryParams() {
      const params = new URLSearchParams(window.location.search);
      return {
        year: params.get('year') || '2026',
        round: (params.get('round') || 'R01').toUpperCase()
      };
    }

    async function initEventPage() {
      const { year, round } = getQueryParams();
      const roundIdx = GP_ROUNDS.findIndex(r => r.round === round);
      const gp = GP_ROUNDS[roundIdx >= 0 ? roundIdx : 0];
      const rIdx = roundIdx >= 0 ? roundIdx : 0;

      const prevGp = roundIdx > 0 ? GP_ROUNDS[roundIdx - 1] : null;
      const nextGp = roundIdx < GP_ROUNDS.length - 1 ? GP_ROUNDS[roundIdx + 1] : null;

      document.title = `${year} ${gp.round} · ${gp.name} · Overrevving`;

      let gridResults = [];
      let sprintResults = [];
      let raceResults = [];
      let weatherInfo = { track: 'Dry', weather: 'Partly-Cloudy', air: '32°C', ground: '50°C', humidity: '45%' };

      if (typeof STATIC_EVENT_DATA !== 'undefined' && STATIC_EVENT_DATA[gp.short]) {
        const evData = STATIC_EVENT_DATA[gp.short];
        if (evData.grid && evData.grid.length) gridResults = evData.grid;
        if (evData.sprint && evData.sprint.length) sprintResults = evData.sprint;
        if (evData.race && evData.race.length) raceResults = evData.race;
      }

      // Load JSONBin Data (Guaranteed Fallback)
      try {
        const binRes = await fetch(BIN_URL, { headers: { 'X-Access-Key': API_KEY } });
        if (binRes.ok) {
          const binJson = await binRes.json();
          const motogpBin = binJson.record.motogp || [];

          // Compute Sprint & Main Race Standings from JSONBin history
          const sprList = [];
          const longList = [];

          motogpBin.forEach(r => {
            const sprPts = (r.sprint_history && r.sprint_history[rIdx] !== undefined) ? r.sprint_history[rIdx] : 0;
            const longPts = (r.long_history && r.long_history[rIdx] !== undefined) ? r.long_history[rIdx] : 0;

            sprList.push({
              rider: { full_name: r.name, number: '' },
              team: { name: '' },
              pts: sprPts
            });

            longList.push({
              rider: { full_name: r.name, number: '' },
              team: { name: '' },
              pts: longPts
            });
          });

          sprList.sort((a, b) => b.pts - a.pts);
          longList.sort((a, b) => b.pts - a.pts);

          if (!sprintResults.length) sprintResults = sprList;
          if (!raceResults.length) raceResults = longList;
        }
      } catch (binErr) {
        console.warn("JSONBin fallback load notice:", binErr);
      }

      // Try Live Pulselive API for rich data (starting grid, top speeds, lap times)
      try {
        const eventsUrl = `https://api.motogp.pulselive.com/motogp/v1/results/events?seasonUuid=${SEASON_2026}&categoryUuid=${CAT_MOTOGP}`;
        const events = await fetch(eventsUrl).then(r => r.json());
        const apiEvent = events.find(e => e.short_name === gp.short);

        if (apiEvent) {
          const sessionsUrl = `https://api.motogp.pulselive.com/motogp/v1/results/sessions?eventUuid=${apiEvent.id}&categoryUuid=${CAT_MOTOGP}`;
          const sessions = await fetch(sessionsUrl).then(r => r.json());

          const qSessions = sessions.filter(s => s.type === 'Q' && s.status === 'FINISHED');
          const sprSess = sessions.find(s => s.type === 'SPR' && s.status === 'FINISHED');
          const racSess = sessions.find(s => s.type === 'RAC' && s.status === 'FINISHED');

          if (racSess && racSess.condition) {
            weatherInfo = {
              track: racSess.condition.track || 'Dry',
              weather: racSess.condition.weather || 'Sunny',
              air: racSess.condition.air || '30°C',
              ground: racSess.condition.ground || '48°C',
              humidity: racSess.condition.humidity || '40%'
            };
          }

          if (qSessions.length) {
            let q2Riders = [];
            let q1Riders = [];

            for (const qs of qSessions) {
              try {
                const qClassUrl = `https://api.motogp.pulselive.com/motogp/v1/results/session/${qs.id}/classification`;
                const data = await fetch(qClassUrl).then(r => r.json());
                if (data.classification && data.classification.length) {
                  if (data.classification.length <= 12 && q2Riders.length === 0) {
                    q2Riders = data.classification;
                  } else {
                    q1Riders = data.classification;
                  }
                }
              } catch(e) {}
            }

            const combined = [];
            const q2RiderIds = new Set();

            q2Riders.forEach((r, idx) => {
              const rId = r.rider ? r.rider.id : (r.id || idx);
              q2RiderIds.add(rId);
              combined.push({
                position: idx + 1,
                rider: r.rider,
                name: r.rider ? r.rider.full_name : r.name || 'Rider',
                time: r.best_lap ? (r.best_lap.time || '-') : '-'
              });
            });

            let p13 = q2Riders.length + 1;
            q1Riders.forEach((r, idx) => {
              const rId = r.rider ? r.rider.id : (r.id || idx);
              if (!q2RiderIds.has(rId)) {
                combined.push({
                  position: p13++,
                  rider: r.rider,
                  name: r.rider ? r.rider.full_name : r.name || 'Rider',
                  time: r.best_lap ? (r.best_lap.time || '-') : '-'
                });
              }
            });

            if (combined.length) {
              gridResults = combined;
            }
          }

          if (sprSess) {
            const classUrl = `https://api.motogp.pulselive.com/motogp/v1/results/session/${sprSess.id}/classification`;
            const data = await fetch(classUrl).then(r => r.json());
            if (data.classification && data.classification.length) {
              sprintResults = data.classification;
            }
          }

          if (racSess) {
            const classUrl = `https://api.motogp.pulselive.com/motogp/v1/results/session/${racSess.id}/classification`;
            const data = await fetch(classUrl).then(r => r.json());
            if (data.classification && data.classification.length) {
              raceResults = data.classification;
            }
          }
        }
      } catch (apiErr) {
        console.warn("Live API query warning (using JSONBin data):", apiErr);
      }

      if (!gridResults.length && (sprintResults.length || raceResults.length)) {
        const source = raceResults.length ? raceResults : sprintResults;
        gridResults = source.map((r, idx) => ({
          position: r.position || idx + 1,
          rider: r.rider,
          name: r.rider ? r.rider.full_name : r.name || 'Rider',
          time: r.best_lap ? (r.best_lap.time || '-') : '-'
        }));
      }

      renderPageLayout(year, gp, prevGp, nextGp, weatherInfo, gridResults, sprintResults, raceResults);
    }

    const FAV_KEY = 'overrevving_favorites';

    function getFavoritesSet() {
      try {
        const list = JSON.parse(localStorage.getItem(FAV_KEY) || '[]');
        return new Set(list);
      } catch(e) {
        return new Set();
      }
    }

    function isRiderFavorite(riderName) {
      if (!riderName) return false;
      const favs = getFavoritesSet();
      const nameTrim = riderName.trim();
      
      if (favs.has(`motogp:${nameTrim}`) || favs.has(nameTrim)) return true;
      
      for (let item of favs) {
        const cleanItem = item.includes(':') ? item.split(':')[1] : item;
        if (cleanItem.toLowerCase() === nameTrim.toLowerCase()) return true;
      }
      return false;
    }

    function toggleFav(btn, riderName) {
      if (!riderName) return;
      const nameTrim = riderName.trim();
      const favKey = `motogp:${nameTrim}`;
      const favs = getFavoritesSet();
      
      let isFavNow = false;
      if (isRiderFavorite(nameTrim)) {
        favs.delete(favKey);
        favs.delete(nameTrim);
        for (let item of Array.from(favs)) {
          const cleanItem = item.includes(':') ? item.split(':')[1] : item;
          if (cleanItem.toLowerCase() === nameTrim.toLowerCase()) favs.delete(item);
        }
      } else {
        favs.add(favKey);
        isFavNow = true;
      }
      
      localStorage.setItem(FAV_KEY, JSON.stringify([...favs]));
      
      document.querySelectorAll('.standings-table tbody tr').forEach(tr => {
        if (tr.dataset.riderName && tr.dataset.riderName.toLowerCase() === nameTrim.toLowerCase()) {
          tr.classList.toggle('favorite', isFavNow);
          const b = tr.querySelector('.fav-btn');
          if (b) b.classList.toggle('active', isFavNow);
        }
      });
    }

    function formatName(fullName) {
      if (!fullName) return '';
      const parts = fullName.trim().split(' ');
      if (parts.length < 2) return fullName;
      const normalized = parts.map(w =>
        w === w.toUpperCase() && w.length > 1 ? w.charAt(0) + w.slice(1).toLowerCase() : w
      );
      return normalized[0][0].toUpperCase() + '. ' + normalized.slice(1).join(' ');
    }

    function calculateSprintPts(pos) {
      const ptsMap = { 1: 12, 2: 9, 3: 7, 4: 6, 5: 5, 6: 4, 7: 3, 8: 2, 9: 1 };
      return ptsMap[pos] || 0;
    }

    function calculateRacePts(pos) {
      const ptsMap = { 1: 25, 2: 20, 3: 16, 4: 13, 5: 11, 6: 10, 7: 9, 8: 8, 9: 7, 10: 6, 11: 5, 12: 4, 13: 3, 14: 2, 15: 1 };
      return ptsMap[pos] || 0;
    }

    function parseLapTimeToSeconds(timeStr) {
      if (!timeStr || timeStr === '-' || !timeStr.includes(':')) return null;
      const parts = timeStr.trim().split(':');
      if (parts.length < 2) return null;
      const min = parseFloat(parts[0]);
      const sec = parseFloat(parts[1]);
      return min * 60 + sec;
    }

    function calculateGap(p1TimeStr, riderTimeStr) {
      const p1Sec = parseLapTimeToSeconds(p1TimeStr);
      const rSec = parseLapTimeToSeconds(riderTimeStr);
      if (p1Sec === null || rSec === null) return '-';
      const diff = rSec - p1Sec;
      if (diff <= 0.0001) return '-';
      return '+' + diff.toFixed(3);
    }

    function renderPageLayout(year, gp, prevGp, nextGp, weather, gridResults, sprintResults, raceResults) {
      const mainEl = document.getElementById('main-content');
      const pdfBase = `https://resources.motogp.com/files/results/${year}/${gp.short}/MotoGP/RAC`;
      const flagHtml = `<img src="https://flagcdn.com/w20/${gp.countryCode}.png" srcset="https://flagcdn.com/w40/${gp.countryCode}.png 2x" class="flag-img" alt="${gp.location}">`;

      let gridRows = '';
      if (gridResults.length) {
        const p1TimeStr = gridResults[0] ? (gridResults[0].time || (gridResults[0].best_lap ? gridResults[0].best_lap.time : null)) : null;
        gridResults.forEach((r, idx) => {
          const isNC = r.pos === 'NC' || r.status === 'OUTSTND' || r.position === null;
          const posNum = isNC ? 'NC' : (r.pos || r.position || idx + 1);
          const posCell = isNC 
            ? `<span class="pos-dnf">NC</span>` 
            : `<span class="${posNum === 1 ? 'pos-1' : posNum === 2 ? 'pos-2' : posNum === 3 ? 'pos-3' : ''}">${posNum}</span>`;
          const rawName = r.rider ? (typeof r.rider === 'string' ? r.rider : (r.rider.full_name || r.name)) : (r.name || 'Rider');
          const isFav = isRiderFavorite(rawName);
          const lapTime = r.time || (r.best_lap ? r.best_lap.time : '-');
          const gapStr = calculateGap(p1TimeStr, lapTime);

          gridRows += `<tr class="${isFav ? 'favorite' : ''}" data-rider-name="${rawName.replace(/"/g, '&quot;')}">
            <td class="star-col">
              <button class="fav-btn ${isFav ? 'active' : ''}" onclick="toggleFav(this, '${rawName.replace(/'/g, "\\'")}')" title="Favorite">★</button>
            </td>
            <td class="pos-cell">${posCell}</td>
            <td>
              <div class="rider-name">${formatName(rawName)}</div>
            </td>
            <td class="time-cell">${lapTime}</td>
            <td class="gap-cell">${gapStr}</td>
          </tr>`;
        });
      } else {
        gridRows = `<tr><td colspan="5" style="text-align:center; padding: 24px; color: var(--text-sub);">No Starting Grid data available for this round.</td></tr>`;
      }

      let sprintRows = '';
      if (sprintResults.length) {
        sprintResults.forEach((r, idx) => {
          const isDNF = r.pos === 'NC' || r.status === 'OUTSTND' || r.position === null || r.status === 'NOTFINISHFIRST';
          const posNum = r.pos || r.position || idx + 1;
          const posCell = isDNF 
            ? `<span class="pos-dnf">DNF</span>` 
            : `<span class="${posNum === 1 ? 'pos-1' : posNum === 2 ? 'pos-2' : posNum === 3 ? 'pos-3' : ''}">${posNum}</span>`;
          
          const pts = isDNF ? '-' : (r.pts !== undefined ? r.pts : calculateSprintPts(posNum));
          const rawName = r.rider ? (typeof r.rider === 'string' ? r.rider : (r.rider.full_name || r.name)) : (r.name || 'Rider');
          const isFav = isRiderFavorite(rawName);

          sprintRows += `<tr class="${isFav ? 'favorite' : ''}" data-rider-name="${rawName.replace(/"/g, '&quot;')}">
            <td class="star-col">
              <button class="fav-btn ${isFav ? 'active' : ''}" onclick="toggleFav(this, '${rawName.replace(/'/g, "\\'")}')" title="Favorite">★</button>
            </td>
            <td class="pos-cell">${posCell}</td>
            <td>
              <div class="rider-name">${formatName(rawName)}</div>
            </td>
            <td class="pts-scored" style="${isDNF ? 'color: #666;' : ''}">${pts}</td>
          </tr>`;
        });
      } else {
        sprintRows = `<tr><td colspan="4" style="text-align:center; padding: 24px; color: var(--text-sub);">No Sprint Race data available for this round.</td></tr>`;
      }

      let raceRows = '';
      if (raceResults.length) {
        raceResults.forEach((r, idx) => {
          const isDNF = r.pos === 'NC' || r.status === 'OUTSTND' || r.position === null || r.status === 'NOTFINISHFIRST';
          const posNum = r.pos || r.position || idx + 1;
          const posCell = isDNF 
            ? `<span class="pos-dnf">DNF</span>` 
            : `<span class="${posNum === 1 ? 'pos-1' : posNum === 2 ? 'pos-2' : posNum === 3 ? 'pos-3' : ''}">${posNum}</span>`;
          
          const pts = isDNF ? '-' : (r.pts !== undefined ? r.pts : calculateRacePts(posNum));
          const rawName = r.rider ? (typeof r.rider === 'string' ? r.rider : (r.rider.full_name || r.name)) : (r.name || 'Rider');
          const isFav = isRiderFavorite(rawName);

          raceRows += `<tr class="${isFav ? 'favorite' : ''}" data-rider-name="${rawName.replace(/"/g, '&quot;')}">
            <td class="star-col">
              <button class="fav-btn ${isFav ? 'active' : ''}" onclick="toggleFav(this, '${rawName.replace(/'/g, "\\'")}')" title="Favorite">★</button>
            </td>
            <td class="pos-cell">${posCell}</td>
            <td>
              <div class="rider-name">${formatName(rawName)}</div>
            </td>
            <td class="pts-scored" style="${isDNF ? 'color: #666;' : ''}">${pts}</td>
          </tr>`;
        });
      } else {
        raceRows = `<tr><td colspan="4" style="text-align:center; padding: 24px; color: var(--text-sub);">No Main Race data available for this round.</td></tr>`;
      }

      mainEl.innerHTML = `
        <div class="hero-card">
          <div class="hero-top">
            <div>
              <div class="round-badge">${year} SEASON · ROUND ${gp.round.replace('R','')}</div>
              <h1 class="event-title">${gp.name}</h1>
              <div class="circuit-sub">
                <span>${flagHtml} ${gp.circuit} · ${gp.location}</span>
                <span>•</span>
                <span>${gp.date}</span>
              </div>
            </div>
          </div>

          <div class="weather-strip">
            <div class="weather-chip">🏁 <span>Track:</span> <strong>${weather.track}</strong></div>
            <div class="weather-chip">☀️ <span>Air Temp:</span> <strong>${weather.air}</strong></div>
            <div class="weather-chip">🛣️ <span>Track Temp:</span> <strong>${weather.ground}</strong></div>
            <div class="weather-chip">💧 <span>Humidity:</span> <strong>${weather.humidity}</strong></div>
            <div class="weather-chip">🌤️ <span>Weather:</span> <strong>${weather.weather}</strong></div>
          </div>
        </div>

        <div class="pdf-bar">
          <div class="pdf-title">📄 Official Dorna PDF Documents:</div>
          <div class="pdf-links">
            <a href="${pdfBase}/Classification.pdf" target="_blank" class="pdf-btn">📊 Classification.pdf</a>
            <a href="${pdfBase}/Analysis.pdf" target="_blank" class="pdf-btn">⏱️ Analysis.pdf</a>
            <a href="${pdfBase}/MaximumSpeed.pdf" target="_blank" class="pdf-btn">🚀 TopSpeed.pdf</a>
            <a href="${pdfBase}/Grid.pdf" target="_blank" class="pdf-btn">🏁 Grid.pdf</a>
            <a href="${pdfBase}/WorldStanding.pdf" target="_blank" class="pdf-btn">🏆 WorldStanding.pdf</a>
          </div>
        </div>

        <div class="grid-three-col">
          <!-- LEFT COLUMN: STARTING GRID -->
          <div class="col-card">
            <div class="col-header grid-header">
              <div>🏁 GRIGLIA DI PARTENZA</div>
            </div>
            <table class="standings-table">
              <thead>
                <tr>
                  <th class="star-col"></th>
                  <th>#</th>
                  <th>Rider</th>
                  <th style="text-align:right">Time</th>
                  <th style="text-align:right">Gap</th>
                </tr>
              </thead>
              <tbody>
                ${gridRows}
              </tbody>
            </table>
          </div>

          <!-- MIDDLE COLUMN: SPRINT RACE -->
          <div class="col-card">
            <div class="col-header sprint-header">
              <div>⚡ GARA SPRINT</div>
            </div>
            <table class="standings-table">
              <thead>
                <tr>
                  <th class="star-col"></th>
                  <th>#</th>
                  <th>Rider</th>
                  <th style="text-align:right">Pts</th>
                </tr>
              </thead>
              <tbody>
                ${sprintRows}
              </tbody>
            </table>
          </div>

          <!-- RIGHT COLUMN: MAIN RACE -->
          <div class="col-card">
            <div class="col-header race-header">
              <div>🏁 GARA LUNGA</div>
            </div>
            <table class="standings-table">
              <thead>
                <tr>
                  <th class="star-col"></th>
                  <th>#</th>
                  <th>Rider</th>
                  <th style="text-align:right">Pts</th>
                </tr>
              </thead>
              <tbody>
                ${raceRows}
              </tbody>
            </table>
          </div>
        </div>

        <div class="round-nav-bar">
          ${prevGp ? `<a href="event.html?year=${year}&round=${prevGp.round}" class="nav-link">← ${prevGp.round}: ${prevGp.name}</a>` : `<span class="nav-link disabled">← First Round</span>`}
          
          <div class="footer-social-inline">
            <div class="footer-social-title">Get in touch with ZioG</div>
            <div class="social-icons">
              <a class="social-icon" href="https://www.instagram.com/ziog.2/" target="_blank" rel="noopener" title="Instagram" style="color:#e1306c">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
              </a>
              <a class="social-icon" href="https://www.youtube.com/@ZioG91" target="_blank" rel="noopener" title="YouTube" style="color:#ff0000">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M23.495 6.205a3.007 3.007 0 0 0-2.088-2.088c-1.87-.501-9.396-.501-9.396-.501s-7.507-.01-9.396.501A3.007 3.007 0 0 0 .527 6.205a31.247 31.247 0 0 0-.522 5.805 31.247 31.247 0 0 0 .522 5.783 3.007 3.007 0 0 0 2.088 2.088c1.868.502 9.396.502 9.396.502s7.506 0 9.396-.502a3.007 3.007 0 0 0 2.088-2.088 31.247 31.247 0 0 0 .5-5.783 31.247 31.247 0 0 0-.5-5.805zM9.609 15.601V8.408l6.264 3.602z"/></svg>
              </a>
              <a class="social-icon" href="https://www.tiktok.com/@ziog91" target="_blank" rel="noopener" title="TikTok" style="color:#ccc">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-2.88 2.5 2.89 2.89 0 0 1-2.89-2.89 2.89 2.89 0 0 1 2.89-2.89c.28 0 .54.04.79.1V9.01a6.33 6.33 0 0 0-.79-.05 6.34 6.34 0 0 0-6.34 6.34 6.34 6.34 0 0 0 6.34 6.34 6.34 6.34 0 0 0 6.33-6.34V8.69a8.18 8.18 0 0 0 4.78 1.52V6.75a4.85 4.85 0 0 1-1.01-.06z"/></svg>
              </a>
              <a class="social-icon" href="https://www.facebook.com/mrandreagalassi/" target="_blank" rel="noopener" title="Facebook" style="color:#1877f2">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
              </a>
            </div>
          </div>

          ${nextGp ? `<a href="event.html?year=${year}&round=${nextGp.round}" class="nav-link">${nextGp.round}: ${nextGp.name} →</a>` : `<span class="nav-link disabled">Final Round →</span>`}
        </div>
      `;
    }

    document.addEventListener('DOMContentLoaded', initEventPage);
  </script>
</body>
