<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moto2 Event Details · Overrevving</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="js/chart.min.js"></script>
  <style>
    :root {
      --bg: #18181c;
      --card-bg: #2c2c32;
      --card-border: #3a3a42;
      --accent-orange: #d35400;
      --accent-red: #c0392b;
      --accent-yellow: #f1c40f;
      --accent-blue: #2980b9;
      --accent-green: #2ecc71;
      --text-main: #e0e0e0;
      --text-sub: #888888;
      --font-heading: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: rgba(20, 20, 24, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--card-border);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 12px 24px;
    }

    .nav-container {
      max-width: 100%;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-logo-link {
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
    }

    .header-logo-img {
      height: 64px;
      width: auto;
      max-width: 360px;
      opacity: 0.95;
      transition: opacity 0.2s ease, transform 0.2s ease;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.4));
    }

    .header-logo-img:hover {
      opacity: 1;
      transform: scale(1.03);
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      border-radius: 8px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .back-btn:hover {
      background: #282832;
      border-color: #4a4a58;
      color: #fff;
    }

    .nav-spacer {
      width: 140px;
    }

    main {
      max-width: 3650px;
      margin: 0 auto;
      padding: 32px 24px;
      width: 100%;
      flex: 1;
    }

    /* Hero Event Card */
    .hero-card {
      background: linear-gradient(135deg, #1c1c24 0%, #252532 100%);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 32px;
      margin-bottom: 24px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
      position: relative;
      overflow: hidden;
    }

    .hero-card::before {
      content: '';
      position: absolute;
      top: 0; right: 0;
      width: 300px; height: 300px;
      background: radial-gradient(circle, rgba(211, 84, 0, 0.15) 0%, rgba(0,0,0,0) 70%);
      pointer-events: none;
    }

    .hero-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 16px;
    }

    .cat-badge {
      display: inline-block;
      padding: 4px 10px;
      background: var(--accent-orange);
      color: #fff;
      border-radius: 6px;
      font-family: var(--font-heading);
      font-weight: 800;
      font-size: 12px;
      letter-spacing: 0.5px;
      margin-right: 8px;
    }

    .round-badge {
      display: inline-block;
      padding: 4px 12px;
      background: rgba(211, 84, 0, 0.2);
      border: 1px solid var(--accent-orange);
      color: #e67e22;
      border-radius: 20px;
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .event-title {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.2;
      margin-bottom: 8px;
    }

    .event-meta {
      display: flex;
      align-items: center;
      gap: 16px;
      color: var(--text-sub);
      font-size: 14px;
      font-weight: 500;
    }

    .meta-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .event-details-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-top: 24px;
      padding-top: 24px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    .detail-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .detail-label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-sub);
      font-weight: 600;
    }

    .detail-val {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-main);
    }

    /* PDF Bar */
    .pdf-bar {
      background: #202026;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 14px 20px;
      margin-bottom: 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 16px;
    }

    .pdf-title {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-sub);
      margin-right: 8px;
    }

    .pdf-links {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .pdf-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: #3498db;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .pdf-btn:hover {
      background: rgba(52, 152, 219, 0.15);
      border-color: #3498db;
      color: #fff;
    }

    /* Grid Wrapper: Moto2 7 Columns (FP1, PR, FP2, Q1, Q2, STARTING GRID, RACE) */
    .grid-wrapper-event {
      overflow-x: auto;
      padding: 0 0 16px 0;
      width: 100%;
      -webkit-overflow-scrolling: touch;
    }

    .grid-moto2-col {
      display: grid;
      grid-template-columns: repeat(7, 350px);
      gap: 16px;
      width: fit-content;
      margin: 0 auto 32px;
    }

    .col-card {
      background: #2c2c32;
      border: 1px solid #3a3a42;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
      box-sizing: border-box;
    }

    .col-header {
      padding: 10px 12px;
      text-align: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .col-header-title {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .col-header-sub {
      font-size: 11px;
      font-weight: 500;
      opacity: 0.88;
      margin-top: 3px;
      letter-spacing: 0.02em;
    }

    .fp1-header  { background: #8e44ad; color: #fff; }
    .pr-header   { background: #d35400; color: #fff; }
    .fp2-header  { background: #16a085; color: #fff; }
    .q1-header   { background: #0984e3; color: #fff; }
    .q2-header   { background: #6c5ce7; color: #fff; }
    .grid-header { background: #2980b9; color: #fff; }
    .race-header { background: #c0392b; color: #fff; }

    .standings-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    .standings-table thead th {
      padding: 7px 8px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #999;
      background: #24242a;
      border-bottom: 1px solid #3a3a42;
    }

    .standings-table tbody tr {
      border-bottom: 1px solid #32323a;
      transition: background 0.15s ease;
    }

    .standings-table tbody tr:hover {
      background: #35353d;
    }

    .standings-table td {
      padding: 5px 8px;
      vertical-align: middle;
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .standings-table tbody tr.favorite {
      background: rgba(241, 196, 15, 0.12) !important;
    }

    .standings-table tbody tr.favorite:hover {
      background: rgba(241, 196, 15, 0.2) !important;
    }

    .standings-table tbody tr.favorite td {
      font-weight: 700;
      color: #fff;
    }

    .fav-btn {
      background: transparent;
      border: none;
      cursor: pointer;
      font-size: 14px;
      color: #555;
      padding: 0 4px;
      line-height: 1;
      transition: color 0.15s ease, transform 0.15s ease;
    }

    .fav-btn:hover {
      color: #f1c40f;
      transform: scale(1.2);
    }

    .fav-btn.active {
      color: #f1c40f;
      text-shadow: 0 0 8px rgba(241, 196, 15, 0.6);
    }

    .pos-col {
      text-align: center;
      font-weight: 700;
      font-size: 12px;
      color: var(--text-sub);
      width: 24px;
    }

    .pos-1 { color: #ffd700; font-weight: 800; }
    .pos-2 { color: #c0c0c0; font-weight: 800; }
    .pos-3 { color: #cd7f32; font-weight: 800; }

    .rider-cell {
      font-weight: 600;
      color: var(--text-main);
    }

    .laps-cell {
      text-align: center !important;
      font-family: 'Inter', monospace;
      font-size: 11px;
      color: #aaa;
    }

    .time-cell {
      text-align: right !important;
      font-family: 'Inter', monospace;
      font-size: 12px;
      font-weight: 600;
      color: #e0e0e0;
    }

    .gap-cell {
      text-align: right !important;
      font-family: 'Inter', monospace;
      font-size: 11px;
      color: #999;
    }

    .pts-cell {
      text-align: right !important;
      font-weight: 800;
      font-size: 13px;
      color: #f1c40f;
      padding-right: 12px !important;
    }

    .pos-dnf {
      color: #ff5555 !important;
      background: rgba(255, 85, 85, 0.15);
      border: 1px solid rgba(255, 85, 85, 0.3);
      padding: 1px 5px;
      border-radius: 4px;
      font-weight: 700;
      font-size: 10px;
      display: inline-block;
      line-height: 1.2;
    }

    /* Sector & Lap Chart Section */
    .sector-section {
      background: #202026;
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 24px;
      margin-bottom: 24px;
    }

    .sector-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .sector-title {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: #fff;
    }

    .sector-subtitle {
      font-size: 12px;
      color: var(--text-sub);
      margin-top: 4px;
    }

    .win-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 6px;
      padding: 6px;
      cursor: pointer;
      color: var(--text-sub);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .win-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
    }

    .progression-grid-2col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    @media (max-width: 1024px) {
      .progression-grid-2col {
        grid-template-columns: 1fr;
      }
    }

    .sector-grid-2x2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    @media (max-width: 1024px) {
      .sector-grid-2x2 {
        grid-template-columns: 1fr;
      }
    }

    .sector-card {
      background: #272730;
      border: 1px solid #363642;
      border-radius: 10px;
      padding: 16px;
      display: flex;
      flex-direction: column;
    }

    .sector-card-title {
      font-size: 13px;
      font-weight: 700;
      color: #bbb;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .sector-card-badge {
      font-size: 10px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
    }

    .badge-t1 { background: rgba(52, 152, 219, 0.2); color: #3498db; }
    .badge-t2 { background: rgba(230, 126, 34, 0.2); color: #e67e22; }
    .badge-t3 { background: rgba(46, 204, 113, 0.2); color: #2ecc71; }
    .badge-t4 { background: rgba(155, 89, 182, 0.2); color: #9b59b6; }

    .progression-canvas-container {
      position: relative;
      height: 380px;
      width: 100%;
    }

    .sector-canvas-container {
      position: relative;
      height: 300px;
      width: 100%;
    }

    /* Sidebar menu (Identical to event.html) */
    .menu-btn {
      position: fixed; top: 16px; right: 16px; z-index: 200;
      width: 42px; height: 42px; border-radius: 8px;
      background: #2c2c32; border: 1px solid #3a3a42;
      cursor: pointer; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 5px;
      transition: background 0.2s;
    }
    .menu-btn:hover { background: #3a3a42; }
    .menu-btn span {
      display: block; width: 20px; height: 2px;
      background: #ccc; border-radius: 2px;
    }

    .sidebar {
      position: fixed; top: 0; right: -280px; width: 260px; height: 100vh;
      background: #2a2a30; border-left: 1px solid #3a3a42;
      z-index: 300; transition: right 0.3s ease;
      display: flex; flex-direction: column;
      padding: 20px 16px; box-shadow: -4px 0 20px rgba(0,0,0,0.4);
      overflow-y: auto;
    }
    .sidebar.open { right: 0; }

    .sidebar-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.5);
      z-index: 299; display: none;
    }
    .sidebar-overlay.open { display: block; }

    .sidebar h3 {
      font-size: 13px; font-weight: 600; color: #888;
      text-transform: uppercase; letter-spacing: 0.08em;
      margin-bottom: 20px; margin-top: 4px;
    }

    .sidebar-close {
      position: absolute; top: 14px; right: 14px;
      background: none; border: none; color: #888;
      font-size: 20px; cursor: pointer; line-height: 1;
    }
    .sidebar-close:hover { color: #ddd; }

    .champ-toggle {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 12px; border-radius: 8px;
      cursor: pointer; margin-bottom: 6px;
      transition: background 0.15s; user-select: none;
    }
    .champ-toggle:hover { background: #333340; }
    .champ-toggle input { display: none; }

    .champ-dot {
      width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0;
    }
    .champ-label { font-size: 14px; color: #ddd; flex: 1; }

    .champ-check {
      width: 18px; height: 18px; border-radius: 4px;
      border: 2px solid #555; display: flex; align-items: center;
      justify-content: center; flex-shrink: 0; transition: all 0.15s;
    }
    .champ-toggle.active .champ-check {
      background: #3d6bbd; border-color: #3d6bbd; color: #fff;
    }
    .champ-check::after { content: ''; display: none; }
    .champ-toggle.active .champ-check::after {
      content: '\2713';
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: #fff;
    }

    .sidebar-actions {
      display: flex; gap: 8px; margin-top: 8px; margin-bottom: 20px;
    }
    .sidebar-btn {
      flex: 1; padding: 7px; border-radius: 7px; border: 1px solid #444;
      background: transparent; color: #888; font-size: 12px;
      cursor: pointer; transition: all 0.15s;
    }
    .sidebar-btn:hover { background: #333340; color: #ddd; }

    .sidebar-social { margin-top: 20px; padding-top: 20px; border-top: 1px solid #3a3a42; }
    .sidebar-social h4 { font-size: 11px; color: #666; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 12px; }

    .social-icons { display: flex; gap: 12px; justify-content: center; }
    .social-icon {
      width: 38px; height: 38px; border-radius: 8px;
      background: #333340; border: 1px solid #3a3a42;
      display: flex; align-items: center; justify-content: center;
      text-decoration: none; transition: background 0.2s, transform 0.15s;
      color: #ccc;
    }
    .social-icon:hover { background: #3a3a50; transform: translateY(-2px); }
    .social-icon svg { width: 18px; height: 18px; fill: currentColor; }

    /* Bottom round navigation */
    .round-nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      flex-wrap: wrap;
      gap: 16px;
    }

    .nav-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      color: var(--text-main);
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .nav-link:hover:not(.disabled) {
      background: #33333d;
      border-color: #555566;
      color: #fff;
    }

    .nav-link.disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .footer-social-inline {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .footer-social-title {
      font-size: 12px;
      color: var(--text-sub);
      font-weight: 600;
    }

    .loading-spinner {
      text-align: center;
      padding: 60px 0;
      color: var(--text-sub);
      font-size: 16px;
    }
  </style>
</head>
<body>

  <!-- Menu button -->
  <button class="menu-btn" onclick="toggleSidebar()" title="Select sessions">
    <span></span><span></span><span></span>
  </button>

  <!-- Sidebar overlay -->
  <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>

  <!-- Sidebar -->

    <h3>Sessions</h3>
    <div class="sidebar-actions">
      <button class="sidebar-btn" onclick="selectAllSessions()">Select all</button>
      <button class="sidebar-btn" onclick="clearAllSessions()">Clear all</button>
    </div>
    <div id="session-list"></div>

    <div class="sidebar-social">
      <h4>Get in touch with ZioG</h4>

    let visibleSessions = new Set(
      JSON.parse(localStorage.getItem('overrevving_event_moto2_sessions') ||
      JSON.stringify(EVENT_SESSIONS.map(s => s.id)))
    );

    function saveSessionPrefs() {
      localStorage.setItem('overrevving_event_moto2_sessions', JSON.stringify([...visibleSessions]));
    }

    function buildSidebarList() {
      const list = document.getElementById('session-list');
      if (!list) return;
      list.innerHTML = '';
      EVENT_SESSIONS.forEach(sess => {
        const active = visibleSessions.has(sess.id);
        const div = document.createElement('div');
        div.className = 'champ-toggle' + (active ? ' active' : '');
        div.dataset.id = sess.id;
        div.innerHTML = `
          <div class="champ-dot" style="background:${sess.color}"></div>
          <span class="champ-label">${sess.label}</span>
          <div class="champ-check"></div>`;
        div.onclick = () => toggleSession(sess.id, div);
        list.appendChild(div);
      });
    }

    function toggleSession(id, el) {
      if (visibleSessions.has(id)) {
        visibleSessions.delete(id);
        el.classList.remove('active');
      } else {
        visibleSessions.add(id);
        el.classList.add('active');
      }
      saveSessionPrefs();
      applySessionVisibility();
      const cur = window.CURRENT_EVENT_SHORT;
      if (cur) {
        if (typeof renderRacLapChart === 'function') renderRacLapChart(cur);
        if (typeof renderRacGapChart === 'function') renderRacGapChart(cur);
        if (typeof renderSectorCharts === 'function') renderSectorCharts(cur);
      }
    }

    function selectAllSessions() {
      EVENT_SESSIONS.forEach(s => visibleSessions.add(s.id));
      buildSidebarList();
      saveSessionPrefs();
      applySessionVisibility();
      const cur = window.CURRENT_EVENT_SHORT;
      if (cur) {
        if (typeof renderRacLapChart === 'function') renderRacLapChart(cur);
        if (typeof renderRacGapChart === 'function') renderRacGapChart(cur);
        if (typeof renderSectorCharts === 'function') renderSectorCharts(cur);
      }
    }

    function clearAllSessions() {
      visibleSessions.clear();
      buildSidebarList();
      saveSessionPrefs();
      applySessionVisibility();
      const cur = window.CURRENT_EVENT_SHORT;
      if (cur) {
        if (typeof renderRacLapChart === 'function') renderRacLapChart(cur);
        if (typeof renderRacGapChart === 'function') renderRacGapChart(cur);
        if (typeof renderSectorCharts === 'function') renderSectorCharts(cur);
      }
    }

      EVENT_SESSIONS.forEach(sess => {

      if (gridEl) {
        gridEl.style.gridTemplateColumns = activeWidths.length ? activeWidths.join(' ') : '350px';
      }

    function renderSingleLapChart(sessionKey, canvasId, currentGpShort, activeFavRiders) {
      const canvasEl = document.getElementById(canvasId);
      if (!canvasEl) return;
      const sessionLapData = (typeof EVENT_LAP_CHARTS_DATA !== 'undefined' && EVENT_LAP_CHARTS_DATA[sessionKey]) ? EVENT_LAP_CHARTS_DATA[sessionKey][currentGpShort] : null;
      if (!sessionLapData || !sessionLapData.riders) return;

      const totalLaps = sessionLapData.totalLaps || 7;
      const labels = Array.from({ length: totalLaps }, (_, i) => `L${i + 1}`);

      const datasets = [];
      activeFavRiders.forEach((rName, idx) => {
        const normKey = Object.keys(sessionLapData.riders).find(k => k.toLowerCase() === rName.toLowerCase());
        const positions = normKey ? sessionLapData.riders[normKey] : null;
        if (!positions) return;

        const style = RIDER_STYLES[rName] || {};
        const color = style.color || LINE_COLORS[idx % LINE_COLORS.length];
        const borderDash = style.borderDash || [];

        datasets.push({
          label: rName,
          data: positions.slice(0, totalLaps),
          borderColor: color,
          backgroundColor: color,
          borderDash: borderDash,
          borderWidth: 2.5,
          pointRadius: 3,
          pointHoverRadius: 6,
          tension: 0.2,
          spanGaps: true
        });
      });

      if (racLapChartInstance) racLapChartInstance.destroy();

      const ctx = canvasEl.getContext('2d');
      racLapChartInstance = new Chart(ctx, {
        type: 'line',
        plugins: [watermarkPlugin],
        data: { labels, datasets },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            y: {
              reverse: true,
              min: 1,
              max: 27,
              ticks: { stepSize: 1, color: '#aaa', font: { size: 10 } },
              grid: { color: 'rgba(255,255,255,0.06)' }
            },
            x: {
              ticks: { color: '#aaa', font: { size: 10 } },
              grid: { color: 'rgba(255,255,255,0.06)' }
            }
          },
          plugins: {
            legend: {
              position: 'top',
              labels: { color: '#e0e0e0', font: { size: 11, family: 'Inter' }, boxWidth: 12, usePointStyle: true }
            },
            tooltip: {
              callbacks: {
                label: (ctx) => `${ctx.dataset.label}: P${ctx.parsed.y}`
              }
            }
          }
        }
      });
    }

    function renderSingleGapChart(sessionKey, canvasId, currentGpShort, activeFavRiders) {
      const canvasEl = document.getElementById(canvasId);
      if (!canvasEl) return;
      const rawLapsData = (typeof EVENT_LAPS_DATA !== 'undefined') ? EVENT_LAPS_DATA[currentGpShort] : null;
      if (!rawLapsData) return;

      const normKeys = Object.keys(rawLapsData);
      if (normKeys.length === 0) return;

      function parseTimeToSec(tStr) {
        if (!tStr) return null;
        const m = String(tStr).trim().match(/^(\d+)'(\d+\.\d+)$/);
        return m ? parseInt(m[1]) * 60 + parseFloat(m[2]) : parseFloat(tStr);
      }

      // Calculate cumulative time per rider
      const cumTimes = {};
      let maxLaps = 0;
      for (let r of normKeys) {
        const laps = rawLapsData[r] || [];
        cumTimes[r] = [];
        let cum = 0;
        laps.forEach(l => {
          const sec = parseTimeToSec(l.time);
          if (sec && sec > 0) {
            cum += sec;
            cumTimes[r].push(cum);
          }
        });
        if (cumTimes[r].length > maxLaps) maxLaps = cumTimes[r].length;
      }

      if (maxLaps === 0) return;
      const labels = Array.from({ length: maxLaps }, (_, i) => `L${i + 1}`);

      // Find leader at each lap
      const leaderTimes = [];
      for (let i = 0; i < maxLaps; i++) {
        let minT = 999999;
        for (let r of normKeys) {
          if (cumTimes[r][i] && cumTimes[r][i] < minT) {
            minT = cumTimes[r][i];
          }
        }
        leaderTimes.push(minT < 999999 ? minT : 0);
      }

      const datasets = [];
      activeFavRiders.forEach((rName, idx) => {
        const matched = normKeys.find(k => k.toLowerCase() === rName.toLowerCase());
        if (!matched || !cumTimes[matched]) return;

        const gapData = cumTimes[matched].map((ct, lapIdx) => {
          const lead = leaderTimes[lapIdx];
          return lead > 0 ? Number((ct - lead).toFixed(3)) : 0;
        });

        const style = RIDER_STYLES[rName] || {};
        const color = style.color || LINE_COLORS[idx % LINE_COLORS.length];
        const borderDash = style.borderDash || [];

        datasets.push({
          label: rName,
          data: gapData,
          borderColor: color,
          backgroundColor: color,
          borderDash: borderDash,
          borderWidth: 2.5,
          pointRadius: 3,
          pointHoverRadius: 6,
          tension: 0.2
        });
      });

      if (racGapChartInstance) racGapChartInstance.destroy();

      const ctx = canvasEl.getContext('2d');
      racGapChartInstance = new Chart(ctx, {
        type: 'line',
        plugins: [watermarkPlugin],
        data: { labels, datasets },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            y: {
              min: 0,
              ticks: {
                color: '#aaa',
                font: { size: 10 },
                callback: (v) => `+${v}s`
              },
              grid: { color: 'rgba(255,255,255,0.06)' }
            },
            x: {
              ticks: { color: '#aaa', font: { size: 10 } },
              grid: { color: 'rgba(255,255,255,0.06)' }
            }
          },
          plugins: {
            legend: {
              position: 'top',
              labels: { color: '#e0e0e0', font: { size: 11, family: 'Inter' }, boxWidth: 12, usePointStyle: true }
            },
            tooltip: {
              callbacks: {
                label: (ctx) => `${ctx.dataset.label}: +${ctx.parsed.y}s`
              }
            }
          }
        }
      });
    }

    function renderSectorCharts(currentGpShort) {
      const sectionEl = document.getElementById('sector-section');
      if (!sectionEl) return;
      if (!currentGpShort) currentGpShort = window.CURRENT_EVENT_SHORT;
      if (!currentGpShort || typeof EVENT_LAPS_DATA === 'undefined' || !EVENT_LAPS_DATA[currentGpShort]) {
        sectionEl.style.display = 'none';
        return;
      }

      const gpLaps = EVENT_LAPS_DATA[currentGpShort];
      const normKeys = Object.keys(gpLaps);
      const activeFavRiders = [];
      for (let rName of normKeys) {
        if (isRiderFavorite(rName)) {
          activeFavRiders.push(rName);
        }
      }

      if (activeFavRiders.length === 0) {
        sectionEl.style.display = 'none';
        return;
      }

      sectionEl.style.display = 'block';

      const sectors = ['t1', 't2', 't3', 't4'];
      sectors.forEach(secKey => {
        const canvasId = 'chart-sector-' + secKey;
        const canvasEl = document.getElementById(canvasId);
        if (!canvasEl) return;

        let maxLaps = 0;
        activeFavRiders.forEach(r => {
          const matched = normKeys.find(k => k.toLowerCase() === r.toLowerCase());
          if (matched && gpLaps[matched]) {
            // Exclude lap 1 and final lap
            const valid = gpLaps[matched].slice(1, -1);
            if (valid.length > maxLaps) maxLaps = valid.length;
          }
        });

        if (maxLaps === 0) return;
        const labels = Array.from({ length: maxLaps }, (_, i) => `L${i + 2}`);

        const datasets = [];
        activeFavRiders.forEach((rName, idx) => {
          const matched = normKeys.find(k => k.toLowerCase() === rName.toLowerCase());
          if (!matched || !gpLaps[matched]) return;

          const data = gpLaps[matched].slice(1, -1).map(l => {
            const val = l[secKey];
            return val ? parseFloat(val) : null;
          });

          const style = RIDER_STYLES[rName] || {};
          const color = style.color || LINE_COLORS[idx % LINE_COLORS.length];
          const borderDash = style.borderDash || [];

          datasets.push({
            label: rName,
            data: data,
            borderColor: color,
            backgroundColor: color,
            borderDash: borderDash,
            borderWidth: 2,
            pointRadius: 3,
            pointHoverRadius: 5,
            tension: 0.2,
            spanGaps: true
          });
        });

        if (sectorChartInstances[secKey]) sectorChartInstances[secKey].destroy();

        const ctx = canvasEl.getContext('2d');
        sectorChartInstances[secKey] = new Chart(ctx, {
          type: 'line',
          plugins: [watermarkPlugin],
          data: { labels, datasets },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
              y: {
                ticks: {
                  color: '#aaa',
                  font: { size: 10 },
                  callback: (v) => `${v}s`
                },
                grid: { color: 'rgba(255,255,255,0.06)' }
              },
              x: {
                ticks: { color: '#aaa', font: { size: 10 } },
                grid: { color: 'rgba(255,255,255,0.06)' }
              }
            },
            plugins: {
              legend: {
                position: 'top',
                labels: { color: '#e0e0e0', font: { size: 10, family: 'Inter' }, boxWidth: 10, usePointStyle: true }
              }
            }
          }
        });
      });
    }

    function renderRacProgression(currentGpShort) {
      const sectionEl = document.getElementById('rac-progression-section');
      if (!sectionEl) return;
      if (!currentGpShort) currentGpShort = window.CURRENT_EVENT_SHORT;
      if (!currentGpShort) return;

      const sessionLapData = (typeof EVENT_LAP_CHARTS_DATA !== 'undefined' && EVENT_LAP_CHARTS_DATA['RAC']) ? EVENT_LAP_CHARTS_DATA['RAC'][currentGpShort] : null;
      const rawLapsData = (typeof EVENT_LAPS_DATA !== 'undefined') ? EVENT_LAPS_DATA[currentGpShort] : null;

      if (!sessionLapData && !rawLapsData) {
        sectionEl.style.display = 'none';
        return;
      }

      const ridersPool = new Set([
        ...Object.keys((sessionLapData && sessionLapData.riders) || {}),
        ...Object.keys(rawLapsData || {})
      ]);

      const activeFavRiders = [];
      for (let rName of ridersPool) {
        if (isRiderFavorite(rName)) {
          activeFavRiders.push(rName);
        }
      }

      if (activeFavRiders.length === 0) {
        sectionEl.style.display = 'none';
        return;
      }

      sectionEl.style.display = 'block';
      renderSingleLapChart('RAC', 'chart-rac-lapchart', currentGpShort, activeFavRiders);
      renderSingleGapChart('RAC', 'chart-rac-gapchart', currentGpShort, activeFavRiders);
    }

    function toggleRacProgressionMinimize() {
      const sec = document.getElementById('rac-progression-section');
      if (sec) sec.classList.toggle('minimized');
    }

    function toggleSectorMinimize() {
      const sec = document.getElementById('sector-section');
      if (sec) sec.classList.toggle('minimized');
    }

    function renderRacLapChart(cur) { renderRacProgression(cur); }
    function renderRacGapChart(cur) { renderRacProgression(cur); }

    const FAV_KEY = 'overrevving_favorites';

    function getFavoritesSet() {
      try {
        const list = JSON.parse(localStorage.getItem(FAV_KEY) || '[]');
        return new Set(list);
      } catch(e) {
        return new Set();
      }
    }

    function isRiderFavorite(riderName) {
      if (!riderName) return false;
      const favs = getFavoritesSet();
      const nameTrim = riderName.trim();
      if (favs.has(`moto2:${nameTrim}`) || favs.has(nameTrim)) return true;
      for (let item of favs) {
        const cleanItem = item.includes(':') ? item.split(':')[1] : item;
        if (cleanItem.toLowerCase() === nameTrim.toLowerCase()) return true;
      }
      return false;
    }

    function toggleFav(btn, riderName) {
      if (!riderName) return;
      const nameTrim = riderName.trim();
      const favKey = `moto2:${nameTrim}`;
      const favs = getFavoritesSet();
      let isFavNow = false;

      if (isRiderFavorite(nameTrim)) {
        favs.delete(favKey);
        favs.delete(nameTrim);
        for (let item of Array.from(favs)) {
          const cleanItem = item.includes(':') ? item.split(':')[1] : item;
          if (cleanItem.toLowerCase() === nameTrim.toLowerCase()) favs.delete(item);
        }
        isFavNow = false;
      } else {
        favs.add(favKey);
        isFavNow = true;
      }

      try {
        localStorage.setItem(FAV_KEY, JSON.stringify(Array.from(favs)));
      } catch(e) {}

      document.querySelectorAll(`tr[data-rider-name]`).forEach(tr => {
        if (tr.dataset.riderName.toLowerCase() === nameTrim.toLowerCase()) {
          tr.classList.toggle('favorite', isFavNow);
          const b = tr.querySelector('.fav-btn');
          if (b) b.classList.toggle('active', isFavNow);
        }
      });

      renderRacProgression();
      renderSectorCharts();
    }

    function formatName(fullName) {
      if (!fullName) return '';
      const parts = fullName.trim().split(' ');
      if (parts.length < 2) return fullName;
      const normalized = parts.map(w =>
        w === w.toUpperCase() && w.length > 1 ? w.charAt(0) + w.slice(1).toLowerCase() : w
      );
      return normalized[0][0].toUpperCase() + '. ' + normalized.slice(1).join(' ');
    }

    function calculateRacePts(pos) {
      const ptsMap = { 1: 25, 2: 20, 3: 16, 4: 13, 5: 11, 6: 10, 7: 9, 8: 8, 9: 7, 10: 6, 11: 5, 12: 4, 13: 3, 14: 2, 15: 1 };
      return ptsMap[pos] || 0;
    }

    function parseLapTimeToSeconds(timeStr) {
      if (!timeStr || timeStr === '-' || !timeStr.includes(':')) return null;
      const parts = timeStr.trim().split(':');
      if (parts.length < 2) return null;
      const min = parseFloat(parts[0]);
      const sec = parseFloat(parts[1]);
      return min * 60 + sec;
    }

    function calculateGap(p1TimeStr, riderTimeStr) {
      const p1Sec = parseLapTimeToSeconds(p1TimeStr);
      const rSec = parseLapTimeToSeconds(riderTimeStr);
      if (p1Sec === null || rSec === null) return '-';
      const diff = rSec - p1Sec;
      if (diff <= 0.0001) return '-';
      return '+' + diff.toFixed(3);
    }

    function getQueryParams() {
      const params = new URLSearchParams(window.location.search);
      let r = params.get('round') || 'R01';
      if (/^\d+$/.test(r)) {
        r = 'R' + r.padStart(2, '0');
      }
      return {
        year: params.get('year') || '2026',
        round: r.toUpperCase()
      };
    }

    async function initEventPage() {
      const { year, round } = getQueryParams();
      const roundIdx = GP_ROUNDS.findIndex(r => r.round === round);
      const gp = GP_ROUNDS[roundIdx >= 0 ? roundIdx : 0];
      const prevGp = roundIdx > 0 ? GP_ROUNDS[roundIdx - 1] : null;
      const nextGp = roundIdx < GP_ROUNDS.length - 1 ? GP_ROUNDS[roundIdx + 1] : null;

      document.title = `${year} Moto2 ${gp.round} · ${gp.name} · Overrevving`;

      let fp1Results = [];
      let prResults = [];
      let fp2Results = [];
      let q1Results = [];
      let q2Results = [];
      let gridResults = [];
      let raceResults = [];
      let weatherInfo = { track: 'Dry', weather: 'Partly-Cloudy', air: '34°C', ground: '54°C', humidity: '42%' };

      if (typeof STATIC_EVENT_DATA !== 'undefined' && STATIC_EVENT_DATA[gp.short]) {
        const evData = STATIC_EVENT_DATA[gp.short];
        if (evData.fp1) fp1Results = evData.fp1;
        if (evData.pr) prResults = evData.pr;
        if (evData.fp2) fp2Results = evData.fp2;
        if (evData.q1) q1Results = evData.q1;
        if (evData.q2) q2Results = evData.q2;
        if (evData.grid) gridResults = evData.grid;
        if (evData.race) raceResults = evData.race;
      }

      renderPageLayout(year, gp, prevGp, nextGp, weatherInfo, fp1Results, prResults, fp2Results, q1Results, q2Results, gridResults, raceResults);
    }

    document.addEventListener('DOMContentLoaded', initEventPage);
  </script>
